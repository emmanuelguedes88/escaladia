<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escala do Dia - Itaquitinga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        policedark: '#0f172a',
                        policeblue: '#1e3a8a',
                        policecyan: '#06b6d4',
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; }
        #matrix-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; pointer-events: none; opacity: 0.15; }
        .falling-item { position: absolute; font-size: 1.5rem; animation: fall linear infinite; text-shadow: 0 0 5px #06b6d4; }
        @keyframes fall { 
            0% { transform: translateY(-50px); opacity: 0; } 
            10% { opacity: 1; } 
            90% { opacity: 1; } 
            100% { transform: translateY(100vh); opacity: 0; } 
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 4px; }
        
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(6, 182, 212, 0.3); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); }
        
        input:disabled, select:disabled {
            background-color: transparent !important; color: #94a3b8 !important; cursor: not-allowed; border-color: transparent !important; appearance: none;
        }
        select:disabled { background-image: none; }
        
        .input-active {
            background-color: #1e293b; border: 1px solid #334155; color: white; border-radius: 0.5rem;
            padding: 0.5rem 0.75rem; width: 100%; transition: all 0.2s;
        }
        .input-active:focus { outline: none; border-color: #06b6d4; box-shadow: 0 0 8px rgba(6, 182, 212, 0.5); }
        
        .btn-neon { position: relative; overflow: hidden; }
        .btn-neon::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: rgba(255,255,255,0.1); transform: rotate(45deg); transition: all 0.3s; opacity: 0; }
        .btn-neon:hover::after { opacity: 1; transform: rotate(45deg) translate(50%, 50%); }
    </style>
</head>
<body class="relative bg-[#020617] min-h-screen text-slate-50">

    <datalist id="efetivo-list"></datalist>

    <div id="matrix-bg"></div>

    <div id="main-wrapper" class="max-w-7xl mx-auto px-2 sm:px-4 lg:px-8 flex flex-col min-h-screen transition-all duration-500 justify-center">
        
        <header id="main-header" class="text-center w-full max-w-3xl mx-auto glass-panel rounded-2xl p-6 sm:p-8 border-t-4 border-t-policecyan relative transition-all duration-500 shadow-2xl">
            <div class="flex justify-center mb-3"><i class="fa-solid fa-shield-halved text-5xl text-policecyan" style="filter: drop-shadow(0 0 15px #06b6d4);"></i></div>
            <h1 class="text-3xl sm:text-4xl font-black uppercase tracking-widest text-white mb-6">Escala do Dia</h1>
            
            <div class="flex flex-col md:flex-row justify-center items-center gap-4 text-sm bg-gray-900/80 p-4 rounded-xl border border-gray-700 w-full shadow-inner">
                <div class="flex flex-wrap items-center gap-3 justify-center">
                    <span class="text-gray-400 font-bold whitespace-nowrap text-lg"><i class="fa-regular fa-calendar-days mr-1"></i> Data:</span>
                    <input type="date" id="data-servico" class="input-active bg-gray-800 border-gray-600 text-policecyan font-bold p-2 rounded-lg w-auto cursor-pointer text-lg text-center" onchange="window.changeDate(this.value)">
                </div>
                
                <div id="status-badge" class="px-4 py-2 rounded-full font-bold text-sm uppercase tracking-wider bg-gray-600 text-white whitespace-nowrap shadow-sm">Carregando...</div>
            </div>

            <div class="flex flex-row flex-wrap justify-center items-center gap-3 w-full mt-6" id="header-buttons">
                <!-- Renderizados via JS -->
            </div>
        </header>

        <div id="main-content" class="w-full mt-8 opacity-0 transition-opacity duration-500 hidden">
            <!-- Renderizado dinamicamente pelo JS -->
        </div>
    </div>

    <div id="login-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 hidden p-4">
        <div class="bg-policedark border border-policecyan rounded-2xl p-6 w-full max-w-sm shadow-[0_0_30px_rgba(6,182,212,0.3)]" id="login-container">
            <h3 class="text-xl font-black mb-4 text-white border-b border-gray-700 pb-3 text-center tracking-wide"><i class="fa-solid fa-user-shield text-policecyan mr-2"></i>Acesso Restrito</h3>
            
            <div class="flex gap-2 mb-5 bg-gray-900 p-1 rounded-lg">
                <button onclick="window.setLoginTab('cmd')" id="tab-cmd" class="flex-1 text-center py-2 text-sm font-bold rounded-md bg-gray-800 text-policecyan shadow transition">Comandante</button>
                <button onclick="window.setLoginTab('admin')" id="tab-admin" class="flex-1 text-center py-2 text-sm font-bold rounded-md text-gray-500 hover:text-gray-300 transition">Administrador</button>
            </div>

            <div id="form-cmd" class="space-y-4">
                <div>
                    <label class="text-[10px] text-policecyan uppercase font-bold ml-1 mb-1 block">Sua Matrícula</label>
                    <input type="text" id="cmd-user" class="input-active text-sm" placeholder="Ex: 123456">
                </div>
                <div>
                    <label class="text-[10px] text-policecyan uppercase font-bold ml-1 mb-1 block">Senha</label>
                    <input type="password" id="cmd-pass" class="input-active text-sm" placeholder="Sua senha">
                </div>
                <button onclick="window.loginCommander()" class="w-full py-3 rounded-full bg-policecyan hover:bg-cyan-500 text-black font-bold text-sm transition shadow-[0_0_15px_rgba(6,182,212,0.4)] mt-2">Entrar na Escala</button>
            </div>

            <div id="form-admin" class="space-y-4 hidden">
                <div>
                    <label class="text-[10px] text-blue-400 uppercase font-bold ml-1 mb-1 block">E-mail do Admin</label>
                    <input type="email" id="admin-email" class="input-active text-sm" placeholder="seu@email.com">
                </div>
                <div>
                    <label class="text-[10px] text-blue-400 uppercase font-bold ml-1 mb-1 block">Senha</label>
                    <input type="password" id="admin-pass" class="input-active text-sm" placeholder="Mínimo 6 caracteres">
                </div>
                <div class="flex gap-2 mt-2">
                    <button onclick="window.loginAdmin()" class="flex-1 py-3 rounded-full bg-blue-700 hover:bg-blue-600 text-white font-bold text-sm transition shadow-lg border border-blue-500">Entrar</button>
                    <button onclick="window.registerAdmin()" class="flex-1 py-3 rounded-full bg-slate-700 hover:bg-slate-600 text-white font-bold text-sm transition shadow-lg border border-slate-500">Cadastrar</button>
                </div>
                <div class="text-center mt-3 pt-3 border-t border-gray-800">
                    <button onclick="window.recoverAdminPassword()" class="text-xs text-yellow-400 hover:text-yellow-300 font-bold transition"><i class="fa-solid fa-envelope mr-1"></i> Esqueci a Senha</button>
                </div>
            </div>

            <div class="flex justify-center mt-6">
                <button onclick="window.closeModals()" class="px-6 py-2 rounded-full bg-gray-800 hover:bg-gray-700 text-gray-400 text-xs transition font-bold"><i class="fa-solid fa-xmark mr-1"></i> Fechar</button>
            </div>
        </div>
    </div>

    <div id="admin-panel-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center z-[100] hidden p-4">
        <div class="bg-slate-900 border border-slate-500 rounded-2xl p-6 w-full max-w-lg shadow-[0_0_30px_rgba(100,116,139,0.3)]">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                <h3 class="text-xl font-bold text-white"><i class="fa-solid fa-users-gear text-slate-400 mr-2"></i>Gerenciar Comandantes</h3>
                <button onclick="document.getElementById('admin-panel-modal').classList.add('hidden')" class="text-gray-400 hover:text-white bg-slate-800 rounded-full w-8 h-8 flex items-center justify-center transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-600 mb-5 shadow-inner">
                <h4 class="text-xs text-slate-300 uppercase font-black mb-3"><i class="fa-solid fa-user-plus mr-1"></i> Novo Comandante</h4>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
                    <input type="text" id="new-cmd-nome" class="input-active bg-slate-900 border-slate-700 text-sm" placeholder="Nome (Ex: SGT Guedes)">
                    <input type="text" id="new-cmd-user" class="input-active bg-slate-900 border-slate-700 text-sm" placeholder="Matrícula">
                </div>
                <div class="flex gap-3">
                    <input type="text" id="new-cmd-pass" class="input-active bg-slate-900 border-slate-700 text-sm flex-1" placeholder="Senha Provisória">
                    <button onclick="window.addCommander()" class="bg-slate-600 hover:bg-slate-500 text-white px-6 rounded-lg font-bold text-sm transition">Salvar</button>
                </div>
            </div>

            <h4 class="text-xs text-slate-400 uppercase font-black mb-3">Comandantes Cadastrados</h4>
            <div class="max-h-56 overflow-y-auto pr-2 space-y-2 scrollbar-hide" id="cmd-list">
            </div>
        </div>
    </div>

    <div id="cmd-pass-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center z-[100] hidden p-4">
        <div class="bg-policedark border border-policecyan rounded-2xl p-6 w-full max-w-sm shadow-[0_0_20px_rgba(6,182,212,0.3)]">
            <h3 class="text-lg font-bold mb-4 text-white border-b border-gray-700 pb-2"><i class="fa-solid fa-key text-policecyan mr-2"></i>Trocar Minha Senha</h3>
            <input type="password" id="cmd-new-pass" class="input-active text-sm mb-5" placeholder="Digite a nova senha secreta">
            <div class="flex justify-end gap-3">
                <button onclick="document.getElementById('cmd-pass-modal').classList.add('hidden')" class="px-5 py-2 rounded-full bg-gray-700 text-white font-bold text-sm">Cancelar</button>
                <button onclick="window.changeCmdPassword()" class="px-5 py-2 rounded-full bg-policecyan text-black font-bold text-sm shadow-[0_0_10px_rgba(6,182,212,0.4)]">Salvar Senha</button>
            </div>
        </div>
    </div>

    <div id="policial-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-start pt-4 sm:pt-10 justify-center z-50 hidden overflow-y-auto p-2">
        <div class="bg-policedark border border-green-500 rounded-2xl p-4 sm:p-6 w-full max-w-lg shadow-[0_0_30px_rgba(34,197,94,0.2)] mb-10 relative">
            <button onclick="window.closeModals()" class="absolute top-4 right-4 text-gray-400 hover:text-white bg-gray-800 rounded-full w-8 h-8 flex items-center justify-center transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 id="modal-pol-title" class="text-xl font-black mb-2 text-white border-b border-gray-700 pb-3"><i class="fa-solid fa-user-plus text-green-400 mr-2"></i>Informar Serviço</h3>
            
            <div class="space-y-4 mt-5">
                <div>
                    <label class="text-xs text-cyan-400 font-bold block mb-1 uppercase tracking-wider">Qual sua função?</label>
                    <select id="pol-role" class="input-active bg-gray-800 text-white border-cyan-800 text-sm font-bold" onchange="window.renderPolicialDynamic()">
                        <option value="sentinelasQ1">Sentinela (1º Quarto)</option>
                        <option value="sentinelasQ2">Sentinela (2º Quarto)</option>
                        <option value="comandante" class="hidden font-bold text-cyan-400">Comandante da Guarda</option>
                        <option value="auxiliar" class="hidden text-cyan-400">Auxiliar do Cmt</option>
                        <option value="armeiro">Armeiro</option>
                        <option value="rancheiro">Rancheiro</option>
                        <option value="motorista">Motorista</option>
                        <option value="operacoes" class="hidden text-cyan-400">Operações</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-gray-900/60 p-4 rounded-xl border border-gray-700 shadow-inner">
                    <div class="sm:col-span-2 relative">
                        <label class="text-[10px] text-gray-400 block uppercase font-bold mb-1">Nome Completo/Guerra</label>
                        <input type="text" id="pol-nome" list="efetivo-list" oninput="window.handleNomeInput(this.value, 'pol-mat', 'pol-grad')" class="input-active bg-gray-800 text-sm font-semibold" placeholder="Digite o nome..." autocomplete="off">
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-400 block uppercase font-bold mb-1">Graduação</label>
                        <select id="pol-grad" class="input-active bg-gray-800 text-sm font-semibold"></select>
                    </div>
                    <div class="sm:col-span-3">
                        <label class="text-[10px] text-gray-400 block uppercase font-bold mb-1">Matrícula</label>
                        <input type="text" id="pol-mat" class="input-active bg-gray-800 text-sm font-mono tracking-wider" placeholder="Ex: 123456">
                    </div>
                </div>

                <div>
                    <label class="text-xs text-gray-400 block mb-1 font-bold uppercase tracking-wider">Situação (Falta/Permuta/PJES)</label>
                    <select id="pol-status" class="input-active bg-gray-800 font-bold text-sm" onchange="window.checkPermutaUI()">
                        <option value="ORDINÁRIO">ORDINÁRIO</option>
                        <option value="PJES" class="text-blue-400">PJES</option>
                        <option value="PERMUTA" class="text-yellow-400">PERMUTA</option>
                    </select>
                </div>

                <div id="pol-permuta-area" class="hidden bg-yellow-900/20 p-4 rounded-xl border border-yellow-700/60 space-y-3 shadow-inner">
                    <h4 class="text-yellow-500 font-black text-sm border-b border-yellow-800/50 pb-2 mb-2"><i class="fa-solid fa-right-left mr-1"></i> Substituído (Quem sai da escala)</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div class="sm:col-span-2">
                            <label class="text-[10px] text-yellow-500 block uppercase font-bold mb-1">Nome</label>
                            <input type="text" id="pol-subnome" list="efetivo-list" oninput="window.handleNomeInput(this.value, 'pol-submat', 'pol-subgrad')" class="input-active border-yellow-800/50 bg-gray-900 text-yellow-100 text-sm" placeholder="Quem está saindo..." autocomplete="off">
                        </div>
                        <div>
                            <label class="text-[10px] text-yellow-500 block uppercase font-bold mb-1">Grad.</label>
                            <select id="pol-subgrad" class="input-active border-yellow-800/50 bg-gray-900 text-yellow-100 text-sm"></select>
                        </div>
                        <div class="sm:col-span-3">
                            <label class="text-[10px] text-yellow-500 block uppercase font-bold mb-1">Matrícula</label>
                            <input type="text" id="pol-submat" class="input-active border-yellow-800/50 bg-gray-900 text-yellow-100 text-sm font-mono" placeholder="Matrícula de quem sai">
                        </div>
                    </div>
                    
                    <div class="pt-3 border-t border-yellow-800/30">
                        <label class="text-[10px] text-yellow-500 block mb-2 uppercase font-bold">Documento / Imagem da Permuta</label>
                        <div class="flex items-center gap-2">
                            <label id="label-file-container" class="cursor-pointer bg-yellow-700/80 hover:bg-yellow-600 text-white px-4 py-3 rounded-xl text-sm font-bold transition flex items-center justify-center gap-2 w-full text-center border border-yellow-500/50 shadow-md">
                                <i class="fa-solid fa-image text-lg"></i> <span id="label-file-text">Selecionar Imagem/PDF</span>
                                <input type="file" id="pol-pdf" accept="image/*,application/pdf" class="hidden" onchange="window.handleFileSelect(this)">
                            </label>
                        </div>
                    </div>
                </div>

                <div id="pol-dynamic-area" class="bg-gray-800/50 p-4 rounded-xl border border-gray-700 shadow-inner">
                    <!-- Preenchido via JS (Postos) -->
                </div>
            </div>
            
            <div class="flex justify-end gap-3 mt-6 border-t border-gray-700 pt-4">
                <button onclick="window.closeModals()" class="px-6 py-2 rounded-full bg-gray-700 hover:bg-gray-600 text-white font-bold text-sm w-full sm:w-auto transition">Cancelar</button>
                <button id="btn-submit-pol" onclick="window.submitPolicialData()" class="px-6 py-2 rounded-full bg-green-700 hover:bg-green-600 text-white font-black text-sm shadow-[0_0_15px_rgba(34,197,94,0.4)] flex justify-center items-center gap-2 w-full sm:w-auto transition">
                    <i class="fa-solid fa-save text-lg"></i> SALVAR NA ESCALA
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed top-4 right-4 text-white px-6 py-3 rounded-xl shadow-[0_0_20px_rgba(0,0,0,0.5)] transition-opacity duration-300 opacity-0 pointer-events-none z-[200] flex items-center gap-3 transform translate-y-[-20px]">
        <i id="toast-icon" class="fa-solid fa-check-circle text-xl"></i> <span id="toast-msg" class="font-bold text-sm"></span>
    </div>

    <div id="alert-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center z-[250] hidden p-4">
        <div class="bg-policedark border border-red-500 rounded-2xl p-6 w-full max-w-sm text-center shadow-[0_0_30px_rgba(239,68,68,0.4)] relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-red-500"></div>
            <i class="fa-solid fa-triangle-exclamation text-5xl text-red-500 mb-4 drop-shadow-md"></i>
            <h3 id="alert-title" class="text-xl font-black text-white mb-2 uppercase tracking-wide">Atenção</h3>
            <p id="alert-msg" class="text-gray-300 mb-6 text-sm whitespace-pre-line"></p>
            <button onclick="document.getElementById('alert-modal').classList.add('hidden')" class="bg-red-600 hover:bg-red-500 text-white px-8 py-3 rounded-full font-bold w-full transition shadow-lg text-lg">Entendi</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        let firebaseConfig = {
            apiKey: "AIzaSyCBvHgurMJzqgPv9_kb5XiWfTaTxjlGuhQ",
            authDomain: "escaladia-e86d7.firebaseapp.com",
            projectId: "escaladia-e86d7",
            storageBucket: "escaladia-e86d7.firebasestorage.app",
            messagingSenderId: "666578280957",
            appId: "1:666578280957:web:518ceae985d1de61d8b994"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);
        const appId = 'escala-itaquitinga';

        const GRADUACOES = ['SD', 'CB', '3º SGT', '2º SGT', '1º SGT', 'SUB TEN', '2º TEN', '1º TEN', 'CAP', 'MAJ', 'TC', 'CEL'];
        const STATUS_OPCOES = ['ORDINÁRIO', 'PJES', 'PERMUTA'];
        const TURNOS_Q1 = [{ id: 't1', label: '08h-11h' }, { id: 't3', label: '14h-17h' }, { id: 't5', label: '20h-23h' }, { id: 't7', label: '02h-05h' }];
        const TURNOS_Q2 = [{ id: 't2', label: '11h-14h' }, { id: 't4', label: '17h-20h' }, { id: 't6', label: '23h-02h' }, { id: 't8', label: '05h-08h' }];
        
        let isEditMode = false;
        let isAdmin = false;
        let loggedCmdId = null;
        let currentDate = new Date().toISOString().split('T')[0];
        let unsubscribeSnapshot = null;
        let fileToUpload = null; 
        
        const defaultState = {
            status: 'draft',
            postosAtivos: ['Posto 2', 'Posto 3', 'Posto 6', 'Posto 7', 'Posto 8', 'Posto 9'],
            efetivoFixo: {
                comandante: { nome: '', matricula: '', grad: '1º SGT', status: 'ORDINÁRIO', subNome: '', subMat: '', subGrad: 'SD', pdfUrl: '' },
                auxiliar: { nome: '', matricula: '', grad: 'CB', status: 'ORDINÁRIO', subNome: '', subMat: '', subGrad: 'SD', pdfUrl: '' },
                armeiro: { nome: '', matricula: '', grad: 'SD', status: 'ORDINÁRIO', subNome: '', subMat: '', subGrad: 'SD', pdfUrl: '' },
                rancheiro: { nome: '', matricula: '', grad: 'SD', status: 'ORDINÁRIO', subNome: '', subMat: '', subGrad: 'SD', pdfUrl: '' },
                motorista: { nome: '', matricula: '', grad: 'SD', status: 'ORDINÁRIO', subNome: '', subMat: '', subGrad: 'SD', pdfUrl: '' },
                operacoes: { nome: '', matricula: '', grad: '2º TEN', status: 'ORDINÁRIO', subNome: '', subMat: '', subGrad: 'SD', pdfUrl: '' }
            },
            sentinelasQ1: [], sentinelasQ2: []
        };
        let state = JSON.parse(JSON.stringify(defaultState));
        let efetivoConhecido = []; 

        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }

        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            toast.className = `fixed top-4 right-4 text-white px-6 py-3 rounded-xl shadow-[0_0_20px_rgba(0,0,0,0.5)] transition-all duration-300 z-[300] flex items-center gap-3 transform translate-y-0 ${type === 'warning' ? 'bg-yellow-600' : (type==='error'?'bg-red-600':'bg-green-600')}`;
            document.getElementById('toast-icon').className = type === 'warning' ? 'fa-solid fa-triangle-exclamation text-xl' : (type==='error'?'fa-solid fa-xmark text-xl':'fa-solid fa-check-circle text-xl');
            document.getElementById('toast-msg').innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translate-y(-20px)'; }, 4000);
        }

        window.showAlert = (title, msg) => {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-msg').innerText = msg;
            document.getElementById('alert-modal').classList.remove('hidden');
        };

        function extrairEfetivoMemoria() {
            const temp = {};
            const add = (p) => { if(p && p.nome && p.matricula) temp[p.matricula] = { nome: p.nome, matricula: p.matricula, grad: p.grad }; };
            Object.values(state.efetivoFixo).forEach(add);
            state.sentinelasQ1.forEach(add);
            state.sentinelasQ2.forEach(add);

        async function listenToDate(dateStr) {
            currentDate = dateStr;
            document.getElementById('data-servico').value = currentDate;
            document.getElementById('status-badge').innerText = "Carregando...";
            if (unsubscribeSnapshot) unsubscribeSnapshot();

            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'escalas', currentDate);
            unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    state = docSnap.data();
                    if(!state.sentinelasQ1) state.sentinelasQ1 = [];
                    if(!state.sentinelasQ2) state.sentinelasQ2 = [];
                } else {
                    state = JSON.parse(JSON.stringify(defaultState));
                }
                extrairEfetivoMemoria();
                render();
            }, (error) => {
                const localData = localStorage.getItem(`escala_${currentDate}`);
                state = localData ? JSON.parse(localData) : JSON.parse(JSON.stringify(defaultState));
                extrairEfetivoMemoria();

        async function processFileUpload(file, path) {
            try {
                const fileRef = storageRef(storage, path);
                await uploadBytes(fileRef, file);
                return await getDownloadURL(fileRef);
            } catch (e) {
                console.warn("Upload Storage bloqueado. Usando Fallback Base64.", e);
                window.showAlert("Aviso de Anexo", "O arquivo foi salvo internamente no banco de dados, pois o Firebase Storage rejeitou o link externo.\n\nPara consertar isso definitivamente e gerar o link para o WhatsApp, altere as regras do 'Storage' no painel do Firebase para 'allow read, write: if true;'.");
                
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        if(reader.result.length > 700000) reject(new Error("Arquivo muito grande."));
                        else resolve(reader.result);
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }
        }

        window.submitPolicialData = async () => {
            const role = document.getElementById('pol-role').value;

            const mat = document.getElementById('pol-mat').value.trim();
            const nome = document.getElementById('pol-nome').value.trim().toUpperCase();
            const status = document.getElementById('pol-status').value;
            
            if(!mat || !nome) return showToast("Preencha Matrícula e Nome!", "warning");

            let subNome = '', subMat = '', subGrad = 'SD', pdfUrl = '';
            
            if (status === 'PERMUTA') {
                subGrad = document.getElementById('pol-subgrad').value;
                subNome = document.getElementById('pol-subnome').value.toUpperCase();
                subMat = document.getElementById('pol-submat').value.trim();
                
                if (fileToUpload) {
                    const btn = document.getElementById('btn-submit-pol');
                    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ENVIANDO ARQUIVO...`;
                    btn.disabled = true;
                    try {
                        const fileExt = fileToUpload.name.split('.').pop();
                        const fileName = `escalas_pdfs/${currentDate}/${Date.now()}_${mat}.${fileExt}`;
                        pdfUrl = await processFileUpload(fileToUpload, fileName);
                    } catch (e) {
                        btn.innerHTML = `<i class="fa-solid fa-save text-lg"></i> SALVAR NA ESCALA`;
                        btn.disabled = false;
                        if(e.message === "Arquivo muito grande.") showToast("Imagem muito pesada (Limite 700KB).", "error");
                        return;
                    }
                }
            }

            let p = ['Folga','Folga','Folga','Folga'];
            if (role.startsWith('sentinelas')) {
                p = [
                    document.getElementById('pol-posto-0').value,
                    document.getElementById('pol-posto-1').value,
                    document.getElementById('pol-posto-2').value,
                    document.getElementById('pol-posto-3').value
                ];
                
                if(!isEditMode) {
                    const postosUsados = p.filter(x => x !== 'Folga');
                    const duplicados = postosUsados.filter((item, index) => postosUsados.indexOf(item) !== index);
                    if(duplicados.length > 0) return window.showAlert("Bloqueio Anti-Repetição", "Você não pode escolher o mesmo posto duas vezes!\n(Apenas o Comandante tem permissão para repetir postos).");
                    
                    const turnosObj = role === 'sentinelasQ1' ? TURNOS_Q1 : TURNOS_Q2;

                            if (isTaken) return window.showAlert("Posto Ocupado", `O posto ${p[i]} no horário de ${turnosObj[i].label} já foi escolhido por outro policial.\n\nPor favor, escolha outro posto livre.`);
                        }
                    }
                }
            }

            if (role.startsWith('sentinelas')) {
                state[role].push({ id: generateId(), grad, nome, matricula: mat, status, subNome, subMat, subGrad, pdfUrl, postos: p });

                            <label class="text-[9px] text-gray-400 block uppercase font-bold ml-1">Matrícula</label>
                            <input type="text" value="${d.matricula}" onchange="window.updateEfetivo('${roleKey}','matricula',this.value)" class="${inClass} font-mono font-bold text-blue-300" placeholder="-" ${dis}>
                        </div>
                        <div class="w-full sm:w-1/4">
                            <label class="text-[9px] text-gray-400 block uppercase font-bold ml-1">Situação</label>
                            <select onchange="window.updateEfetivo('${roleKey}','status',this.value)" class="${inClass} ${isPermuta?'text-yellow-400 font-black':(d.status==='PJES'?'text-blue-400 font-black':'font-bold')}" ${dis}>
                                ${STATUS_OPCOES.map(s => `<option value="${s}" ${d.status===s?'selected':''}>${s}</option>`).join('')}
                            </select>
                        </div>
                    </div>`;
            if(isPermuta) {
                h += `<div class="flex flex-wrap items-center gap-3 mt-3 ml-2 bg-yellow-900/20 p-3 rounded-xl border border-yellow-700/50 text-[10px] shadow-inner">
                        <div class="w-full sm:w-auto text-yellow-500 font-black mb-1 sm:mb-0"><i class="fa-solid fa-arrow-turn-up fa-rotate-90"></i> Substitui:</div>
                        <select onchange="window.updateEfetivo('${roleKey}','subGrad',this.value)" class="${inClass} w-full sm:w-24 text-yellow-300 font-bold" ${dis}>${GRADUACOES.map(g => `<option value="${g}" ${d.subGrad===g?'selected':''}>${g}</option>`).join('')}</select>
                        <input type="text" value="${d.subNome}" onchange="window.updateEfetivo('${roleKey}','subNome',this.value)" class="${inClass} flex-1 min-w-[120px] text-yellow-300 font-bold" placeholder="Nome do substituído" ${dis}>
                        <div class="flex items-center gap-2 w-full sm:w-auto">
                            <span class="text-yellow-500 font-bold">Mat:</span>
                            <input type="text" value="${d.subMat}" onchange="window.updateEfetivo('${roleKey}','subMat',this.value)" class="${inClass} w-28 text-yellow-300 font-mono font-bold" placeholder="Matrícula" ${dis}>
                        </div>
                        <div class="w-full sm:w-auto mt-2 sm:mt-0 flex justify-end">
                            ${getPdfBadgeHTML(d.pdfUrl)}
                        </div>
                    </div>`;
            }
            return h + `</div>`;
        }

        // Tabela estendida com larguras muito maiores (min-w-[1200px]) para não cortar texto
        function renderQuartoTable(qKey, title, icon, horarios) {
            const list = state[qKey];
            const dis = isEditMode ? '' : 'disabled';
            const inClass = dis === '' ? 'input-active text-sm' : 'input-active bg-transparent border-transparent text-gray-200 text-sm pl-0';

            let h = `<div class="glass-panel p-4 rounded-xl mb-8 border-l-4 border-l-blue-500 shadow-lg overflow-hidden">
                    <div class="flex justify-between items-center border-b border-gray-700 pb-3 mb-4">
                        <h3 class="text-white font-black text-xl tracking-wide"><i class="${icon} text-blue-400 mr-2"></i>${title}</h3>
                    </div>
                    
                    <!-- Container com overflow-x-auto para a tabela extra larga -->
                    <div class="overflow-x-auto pb-4 scrollbar-hide rounded-lg border border-gray-800/50">
                        <table class="w-full text-left border-collapse whitespace-nowrap min-w-[1200px]">
                            <thead>
                                <tr class="bg-gray-800 text-gray-400 text-xs uppercase tracking-widest">
                                    <th class="p-3 w-12 text-center font-black">#</th>
                                    <th class="p-3 w-28 font-black">Grad.</th>
                                    <th class="p-3 w-80 font-black">Nome / Matrícula</th>
                                    <th class="p-3 w-40 font-black border-r border-gray-700/50">Situação</th>
                                    ${horarios.map(t => `<th class="p-3 w-40 text-center border-r border-gray-700/50 text-policecyan bg-gray-900/80"><i class="fa-regular fa-clock"></i> ${t.label}</th>`).join('')}
                                    ${dis===''?`<th class="p-3 w-12 bg-gray-800"></th>`:''}
                                </tr>
                            </thead>
                            <tbody class="text-sm bg-gray-900/30">`;
            
            if(list.length === 0) h += `<tr><td colspan="9" class="p-8 text-center text-gray-500 italic font-bold">Nenhum policial escalado neste quarto.</td></tr>`;

            list.forEach((s, idx) => {
                const isPermuta = s.status === 'PERMUTA';
                h += `<tr class="border-b border-gray-800 hover:bg-gray-800/60 transition group">
                    <td class="p-3 text-center text-gray-500 font-mono font-bold bg-gray-900/20">${idx+1}</td>
                    <td class="p-3"><select onchange="window.updateSentinela('${qKey}','${s.id}','grad',this.value)" class="${inClass} w-full min-w-[5rem] font-bold" ${dis}>${GRADUACOES.map(g=>`<option value="${g}" ${s.grad===g?'selected':''}>${g}</option>`).join('')}</select></td>
                    <td class="p-3 relative">
                        <input type="text" value="${s.nome}" list="efetivo-list" onchange="window.updateSentinela('${qKey}','${s.id}','nome',this.value)" class="${inClass} font-bold text-white mb-1 w-full min-w-[15rem]" ${dis}>
                        <div class="flex items-center gap-1 text-[10px] text-gray-400 font-bold ml-1">MAT: <input type="text" value="${s.matricula}" onchange="window.updateSentinela('${qKey}','${s.id}','matricula',this.value)" class="${inClass} py-0 w-32 text-blue-300 font-mono" ${dis}></div>
                    </td>
                    <td class="p-3 border-r border-gray-800/60 bg-gray-900/10">
                        <select onchange="window.updateSentinela('${qKey}','${s.id}','status',this.value)" class="${inClass} w-full min-w-[8rem] font-black ${isPermuta?'text-yellow-400':(s.status==='PJES'?'text-blue-400':'')}" ${dis}>${STATUS_OPCOES.map(op=>`<option value="${op}" ${s.status===op?'selected':''}>${op}</option>`).join('')}</select>
                    </td>`;

                s.postos.forEach((posto, slotIndex) => {
                    const isFolga = posto === 'Folga' || posto === '';
                    const selectBg = isFolga ? (dis===''?'text-gray-500':'text-gray-600') : 'text-cyan-400 font-bold bg-cyan-900/30 border-cyan-700';
                    h += `<td class="p-3 border-r border-gray-800/60 bg-gray-900/40 text-center relative">
                        <select onchange="window.updateTurno('${qKey}','${s.id}',${slotIndex},this.value,this)" class="${inClass} ${selectBg} text-center shadow-inner w-full min-w-[7rem]" ${dis}>
                            <option value="Folga" class="text-gray-500">🛌 Folga</option>
                            ${state.postosAtivos.map(p => `<option value="${p}" ${posto===p?'selected':''}>${p}</option>`).join('')}
                        </select>
                    </td>`;
                });

                if(dis==='') h += `<td class="p-3 text-center bg-gray-900/20"><button onclick="window.removeSentinela('${qKey}','${s.id}')" class="text-gray-600 hover:text-red-500 bg-gray-800 hover:bg-red-900/30 p-2 rounded-lg transition transform hover:scale-110"><i class="fa-solid fa-trash"></i></button></td>`;
                h += `</tr>`;

                if(isPermuta) {
                    h += `<tr class="bg-yellow-900/10 border-b border-gray-800/60 shadow-inner">
                        <td colspan="3" class="p-3 text-right text-xs text-yellow-500 font-black pr-4 uppercase tracking-widest"><i class="fa-solid fa-arrow-turn-up fa-rotate-90"></i> Subst:</td>
                        <td colspan="3" class="p-3"><div class="flex gap-3 text-sm">
                            <select onchange="window.updateSentinela('${qKey}','${s.id}','subGrad',this.value)" class="${inClass} w-28 text-yellow-300 font-bold" ${dis}>${GRADUACOES.map(g=>`<option value="${g}" ${s.subGrad===g?'selected':''}>${g}</option>`).join('')}</select>
                            <input type="text" value="${s.subNome}" onchange="window.updateSentinela('${qKey}','${s.id}','subNome',this.value)" class="${inClass} w-full text-yellow-300 font-bold min-w-[15rem]" placeholder="Nome Completo" ${dis}>
                        </div></td>
                        <td colspan="2" class="p-3"><div class="flex items-center gap-3 text-sm">
                            <span class="text-yellow-500 font-black">MAT:</span>
                            <input type="text" value="${s.subMat}" onchange="window.updateSentinela('${qKey}','${s.id}','subMat',this.value)" class="${inClass} w-32 text-yellow-300 font-mono font-bold" placeholder="Matrícula" ${dis}> 
                            ${getPdfBadgeHTML(s.pdfUrl)}
                        </div></td>
                        ${dis===''?`<td class="bg-yellow-900/5"></td>`:''}
                    </tr>`;
                }
            });
            h += `</tbody></table></div></div>`;
            return h;
        }

        function render() {
            const badge = document.getElementById('status-badge');
            const headBtns = document.getElementById('header-buttons');
            const wrapper = document.getElementById('main-wrapper');
            const mainContent = document.getElementById('main-content');
            
            if (!isEditMode && state.status === 'draft') {
                wrapper.classList.add('justify-center');
                wrapper.classList.remove('pt-6', 'pb-24');
                mainContent.classList.add('hidden');
                mainContent.classList.remove('opacity-100');
            } else {
                wrapper.classList.remove('justify-center');
                wrapper.classList.add('pt-6', 'pb-24');
                mainContent.classList.remove('hidden');
                setTimeout(() => mainContent.classList.add('opacity-100'), 50);
            }

            if (state.status === 'approved') {
                badge.className = "px-5 py-2 rounded-full font-black text-xs uppercase tracking-widest bg-green-700 text-white shadow-[0_0_15px_rgba(22,163,74,0.6)] border border-green-500 whitespace-nowrap";
                badge.innerHTML = '<i class="fa-solid fa-lock mr-2"></i> Escala Aprovada e Trancada';
            } else {
                badge.className = "px-5 py-2 rounded-full font-black text-xs uppercase tracking-widest bg-yellow-600 text-white shadow-[0_0_15px_rgba(202,138,4,0.6)] border border-yellow-500 whitespace-nowrap";
                badge.innerHTML = '<i class="fa-solid fa-pen-ruler mr-2"></i> Rascunho em Construção';
            }

            let btnsHtml = '';
            
            if (!isEditMode && state.status !== 'approved') {
                btnsHtml += `<button onclick="window.openPolicialModal()" class="bg-green-600/90 hover:bg-green-500 text-white px-6 py-2.5 rounded-full text-xs sm:text-sm font-black whitespace-nowrap transition border border-green-400 flex items-center gap-2 shadow-[0_0_15px_rgba(34,197,94,0.5)] tracking-wide"><i class="fa-solid fa-user-plus text-lg"></i> INFORMAR SERVIÇO</button>`;
            }

            if (isEditMode) {
                if(isAdmin) btnsHtml += `<button onclick="window.openAdminPanel()" class="bg-blue-700/90 hover:bg-blue-600 text-white px-6 py-2.5 rounded-full text-xs sm:text-sm font-bold whitespace-nowrap transition border border-blue-400 flex items-center gap-2 shadow-lg"><i class="fa-solid fa-users-gear text-lg"></i> Gerenciar Comandantes</button>`;
                else btnsHtml += `<button onclick="document.getElementById('cmd-pass-modal').classList.remove('hidden')" class="bg-indigo-700/90 hover:bg-indigo-600 text-white px-6 py-2.5 rounded-full text-xs sm:text-sm font-bold whitespace-nowrap transition border border-indigo-400 flex items-center gap-2 shadow-lg"><i class="fa-solid fa-key text-lg"></i> Trocar Minha Senha</button>`;
                
                btnsHtml += `<button onclick="window.openPolicialModal()" class="bg-green-600/90 hover:bg-green-500 text-white px-6 py-2.5 rounded-full text-xs sm:text-sm font-black whitespace-nowrap transition border border-green-400 flex items-center gap-2 shadow-[0_0_15px_rgba(34,197,94,0.5)] tracking-wide"><i class="fa-solid fa-user-shield text-lg"></i> INSERIR POLICIAL</button>`;
                btnsHtml += `<button onclick="window.logout()" class="bg-red-800/90 hover:bg-red-700 text-white px-5 py-2.5 rounded-full text-xs sm:text-sm font-bold whitespace-nowrap transition border border-red-500 flex items-center gap-2 shadow-lg"><i class="fa-solid fa-right-from-bracket text-lg"></i> Sair</button>`;
            } else {
                btnsHtml += `<button onclick="window.openLoginModal()" class="bg-gray-800/90 hover:bg-gray-700 text-cyan-400 px-6 py-2.5 rounded-full text-xs sm:text-sm font-bold whitespace-nowrap transition border border-cyan-800 flex items-center gap-2 shadow-lg"><i class="fa-solid fa-shield-halved text-lg"></i> Acesso Restrito</button>`;
            }
            headBtns.innerHTML = btnsHtml;

            if (isEditMode || state.status === 'approved') {
                mainContent.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                        ${renderRoleForm('comandante', 'Cmt Guarda', 'fa-solid fa-star')}
                        ${renderRoleForm('auxiliar', 'Auxiliar', 'fa-solid fa-star-half-stroke')}
                        ${renderRoleForm('operacoes', 'Operações', 'fa-solid fa-bolt')}
                        ${renderRoleForm('armeiro', 'Armeiro', 'fa-solid fa-gun')}
                        ${renderRoleForm('rancheiro', 'Rancheiro', 'fa-solid fa-utensils')}
                        ${renderRoleForm('motorista', 'Motorista', 'fa-solid fa-car-side')}
                    </div>
                    ${renderQuartoTable('sentinelasQ1', '1º Quarto', 'fa-solid fa-sun', TURNOS_Q1)}
                    ${renderQuartoTable('sentinelasQ2', '2º Quarto', 'fa-solid fa-moon', TURNOS_Q2)}

                    <div class="flex flex-wrap justify-center mb-10 mt-10 gap-5 px-2">
                        ${isEditMode ? `
                            <button onclick="window.generateWhatsAppReport()" class="bg-green-600 hover:bg-green-500 text-white px-8 py-4 rounded-full font-black shadow-[0_0_20px_rgba(22,163,74,0.6)] flex items-center justify-center gap-3 w-full sm:w-auto text-lg transition transform hover:scale-105 border border-green-400 tracking-wider">
                                <i class="fa-brands fa-whatsapp text-3xl"></i> ENVIAR PARA WHATSAPP
                            </button>
                        ` : ''}
                        ${isEditMode && state.status === 'draft' ? `
                            <button onclick="window.approveScale()" class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-4 rounded-full font-black shadow-[0_0_20px_rgba(37,99,235,0.6)] flex items-center justify-center gap-3 w-full sm:w-auto text-lg transition transform hover:scale-105 border border-blue-400 tracking-wider">
                                <i class="fa-solid fa-lock text-2xl"></i> APROVAR ESCALA
                            </button>
                        ` : ''}
                        ${isEditMode && state.status === 'approved' ? `
                            <button onclick="window.reopenScale()" class="bg-yellow-600 hover:bg-yellow-500 text-white px-8 py-4 rounded-full font-black shadow-lg flex items-center justify-center gap-3 w-full sm:w-auto transition border border-yellow-400 text-lg tracking-wider">
                                <i class="fa-solid fa-unlock text-2xl"></i> REABRIR ESCALA
                            </button>
                        ` : ''}
                    </div>
                `;
            }
        }

        window.onload = async () => {
            const bg = document.getElementById('matrix-bg');
            const emojis = ['🚔','🚁','👮','🛡️','🚨'];
            setInterval(() => {
                const item = document.createElement('div');
                item.className = 'falling-item';
                item.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                item.style.left = Math.random() * 100 + 'vw';
                item.style.animationDuration = (Math.random() * 3 + 3) + 's';
                bg.appendChild(item);
                setTimeout(() => item.remove(), 6000);
            }, 300);
            
            try {
                await signInAnonymously(auth);
                listenToDate(currentDate);
            } catch (e) {
                 if (e.message && e.message.includes('auth/requests-from-referer')) {
                    console.warn("Aviso: Autenticação anônima bloqueada por restrições de domínio.");
                 }
                listenToDate(currentDate);
            }
        };
    </script>
</body>
</html>
